name: Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        packages: ['', hello]
        empty_packages_behavior: [error, warn, ignore, '', typo]
        debug: [false, true]
    steps:
      - uses: actions/checkout@v4
      - id: apt-cache
        uses: tueda/cache-apt-pkgs-action@feat-allow-empty-packages-wip1
        with:
          packages: ${{ matrix.packages }}
          empty_packages_behavior: ${{ matrix.empty_packages_behavior }}
          debug: ${{ matrix.debug }}
      - run: |
          echo ${{ steps.apt-cache.outputs.cache-hit }}
          echo ${{ steps.apt-cache.outputs.package-version-list }}
          echo ${{ steps.apt-cache.outputs.all-package-version-list }}
      - run: hello
